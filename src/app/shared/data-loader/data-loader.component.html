<div class="data-loader" [class.data-loader--compact]="compact" role="status" aria-live="polite">
  <div class="data-loader__brand" aria-hidden="true">
    <span class="data-loader__orbit data-loader__orbit--blue"></span>
    <span class="data-loader__orbit data-loader__orbit--red"></span>
    <img src="assets/images/Logo.png" alt="">
  </div>
  <div class="data-loader__copy">
    <strong>{{ label }}</strong>
    <span>Please wait a moment</span>
  </div>
</div>
